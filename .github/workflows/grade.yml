name: Chấm bài tự động & Cập nhật Google Sheet

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # Để bot comment điểm vào Pull Request

jobs:
  grade:
    name: Chấm điểm bài làm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn bài làm
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      # -----------------------------------------------------------
      # BƯỚC 1: Cài đặt Node.js
      # -----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # -----------------------------------------------------------
      # BƯỚC 2: Cài đặt Python & Chấm điểm (Lý thuyết + Thực hành)
      # -----------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện Google Sheets
        run: pip install gspread google-auth

      - name: Chấm điểm & Cập nhật Google Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          ANSWER_KEYS: ${{ secrets.ANSWER_KEYS }}
          HIDDEN_TESTS_B64: ${{ secrets.HIDDEN_TESTS_B64 }}
          STUDENT_USERNAME: ${{ github.event.pull_request.user.login || github.actor }}
          COMMIT_URL: ${{ github.event.pull_request.html_url || github.event.head_commit.url }}
          SPREADSHEET_ID: "1-oSqRicyEM3NKcq5mvrwalWFJukSv_F0BxTx5wBqG5c"
          SHEET_NAME: "bang diem"
        run: python .github/scripts/update_sheet.py

      # -----------------------------------------------------------
      # BƯỚC 3: Bot tự động bình luận điểm vào Pull Request
      # (Chỉ chạy khi học sinh nộp bằng Pull Request)
      # -----------------------------------------------------------
      - name: Phản hồi kết quả vào Pull Request
        if: always() && github.event.pull_request != null
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### 🤖 Đã hoàn tất chấm điểm và đồng bộ Google Sheet!';
            if (fs.existsSync('grading_summary.md')) {
              body = fs.readFileSync('grading_summary.md', 'utf8');
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
